<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Fan Control</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden}
#controls{position:fixed;bottom:20px;width:100%;text-align:center;z-index:999}
button{padding:12px 20px;margin:5px;font-size:16px;border:none;border-radius:10px;background:#0078d4;color:#fff}
</style>
</head>
<body>
<div id="controls">
<button onclick="toggleFan()">Power ON/OFF</button>
<button onclick="setSpeed(1)">Speed 1</button>
<button onclick="setSpeed(2)">Speed 2</button>
<button onclick="setSpeed(3)">Speed 3</button>
</div>
<a-scene embedded vr-mode-ui="enabled:false" arjs="sourceType:webcam;">
<a-marker preset="hiro">
<a-cylinder position="0 0.5 0" radius="0.05" height="1" color="#666"></a-cylinder>
<a-sphere position="0 1.2 0" radius="0.15" color="#444"></a-sphere>
<a-entity id="fanBlades" position="0 1.2 0">
<a-box position="0.25 0 0" width="0.5" height="0.05" depth="0.02" color="#00BFFF"></a-box>
<a-box rotation="0 0 120" position="-0.12 0.22 0" width="0.5" height="0.05" depth="0.02" color="#00BFFF"></a-box>
<a-box rotation="0 0 -120" position="-0.12 -0.22 0" width="0.5" height="0.05" depth="0.02" color="#00BFFF"></a-box>
</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
let fanOn=true,speed=3,angle=0;
function toggleFan(){fanOn=!fanOn;}
function setSpeed(level){speed=level;}
function animate(){const blades=document.querySelector('#fanBlades');if(fanOn&&blades){let rpm=speed===1?2:speed===2?6:12;angle+=rpm;blades.setAttribute('rotation',`0 0 ${angle}`);}requestAnimationFrame(animate);}animate();
</script>
</body>
</html>
